kind = "web"
previewPath = "/"
title = "Daily Habit Tracker"
description = "A personal, mobile-friendly habit tracker focused on extremely fast daily input, configurable yes/no, numeric, and duration habits, daily notes and streaks, consistency scoring, historical corrections, and weekly or monthly progress charts with persistent local storage."
version = "1.0.0"
id = "artifacts/habit-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20387

[services.development]
run = "pnpm --filter @workspace/habit-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/habit-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/habit-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20387"
BASE_PATH = "/"
